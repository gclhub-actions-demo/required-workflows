name: Central required PR policy
on:
  pull_request:

permissions:
  contents: read

jobs:
  policy:
    if: github.repository != 'gclhub-actions-demo/required-workflows'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.policy.outputs.matrix }}
      extensions: ${{ steps.policy.outputs.extensions }}
      has_preflight: ${{ steps.policy.outputs.has_preflight }}
      has_postflight: ${{ steps.policy.outputs.has_postflight }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gclhub-actions-demo/required-workflows
          ref: ${{ github.workflow_sha }}
          path: central
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -I -m pip install -r central/requirements.txt
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: app
          persist-credentials: false
      - id: policy
        env:
          APP_REPOSITORY: ${{ github.repository }}
        run: python -I central/scripts/policy.py validate --root app --repository "$APP_REPOSITORY"

  preflight:
    needs: policy
    if: needs.policy.outputs.has_preflight == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gclhub-actions-demo/required-workflows
          ref: ${{ github.workflow_sha }}
          path: central
          persist-credentials: false
      - uses: ./central/.github/actions/toolchains
      - run: python -I -m pip install -r central/requirements.txt
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: app
          persist-credentials: false
      - env:
          APP_REPOSITORY: ${{ github.repository }}
        run: python -I central/scripts/extension.py --root app --repository "$APP_REPOSITORY" --phase preflight

  baseline:
    needs: [policy, preflight]
    if: >-
      always() && needs.policy.result == 'success' &&
      (needs.preflight.result == 'success' ||
      (needs.policy.outputs.has_preflight == 'false' && needs.preflight.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.policy.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gclhub-actions-demo/required-workflows
          ref: ${{ github.workflow_sha }}
          path: central
          persist-credentials: false
      - uses: ./central/.github/actions/toolchains
      - run: python -I -m pip install -r central/requirements.txt
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: app
          persist-credentials: false
      - env:
          APP_REPOSITORY: ${{ github.repository }}
          PROJECT_ID: ${{ matrix.id }}
          JEST_JUNIT_OUTPUT_DIR: reports
          JEST_JUNIT_OUTPUT_NAME: junit.xml
        run: |
          python -I central/scripts/policy.py validate --root app --repository "$APP_REPOSITORY"
          python -I central/scripts/baseline.py --root app --repository "$APP_REPOSITORY" --id "$PROJECT_ID"

  postflight:
    needs: [policy, baseline]
    if: needs.policy.outputs.has_postflight == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gclhub-actions-demo/required-workflows
          ref: ${{ github.workflow_sha }}
          path: central
          persist-credentials: false
      - uses: ./central/.github/actions/toolchains
      - run: python -I -m pip install -r central/requirements.txt
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: app
          persist-credentials: false
      - env:
          APP_REPOSITORY: ${{ github.repository }}
        run: python -I central/scripts/extension.py --root app --repository "$APP_REPOSITORY" --phase postflight

  final-gate:
    if: always() && github.repository != 'gclhub-actions-demo/required-workflows'
    needs: [policy, preflight, baseline, postflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gclhub-actions-demo/required-workflows
          ref: ${{ github.workflow_sha }}
          path: central
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - env:
          NEEDS: ${{ toJSON(needs) }}
          EXTENSIONS: ${{ needs.policy.outputs.extensions }}
        run: python -I central/scripts/policy.py gate
