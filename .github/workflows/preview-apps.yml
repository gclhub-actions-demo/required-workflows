name: Preview application baselines
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      baselines: ${{ steps.fixtures.outputs.baselines }}
      repositories: ${{ steps.fixtures.outputs.repositories }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: fixtures
        run: python3 -I scripts/preview.py

  preflight:
    needs: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.fixtures.outputs.repositories) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: central
          persist-credentials: false
      - uses: ./central/.github/actions/toolchains
      - run: python -I -m pip install -r central/requirements.txt
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: app
          persist-credentials: false
      - env:
          APP_REPOSITORY: ${{ matrix.repository }}
        run: python -I central/scripts/extension.py --root app --repository "$APP_REPOSITORY" --phase preflight

  baseline:
    needs: [fixtures, preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.fixtures.outputs.baselines) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: central
          persist-credentials: false
      - id: tools
        uses: ./central/.github/actions/toolchains
      - run: python -I -m pip install -r central/requirements.txt
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: app
          persist-credentials: false
      - env:
          APP_REPOSITORY: ${{ matrix.repository }}
          PROJECT_ID: ${{ matrix.id }}
          JEST_JUNIT_OUTPUT_DIR: reports
          JEST_JUNIT_OUTPUT_NAME: junit.xml
          CENTRAL_DOTNET_SDK: ${{ steps.tools.outputs.dotnet-version }}
        run: |
          python -I central/scripts/policy.py validate --root app --repository "$APP_REPOSITORY"
          python -I central/scripts/baseline.py --root app --repository "$APP_REPOSITORY" --id "$PROJECT_ID"

  postflight:
    needs: [fixtures, baseline]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.fixtures.outputs.repositories) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: central
          persist-credentials: false
      - uses: ./central/.github/actions/toolchains
      - run: python -I -m pip install -r central/requirements.txt
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: app
          persist-credentials: false
      - env:
          APP_REPOSITORY: ${{ matrix.repository }}
        run: python -I central/scripts/extension.py --root app --repository "$APP_REPOSITORY" --phase postflight

  preview-gate:
    if: always()
    needs: [fixtures, preflight, baseline, postflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          needs = json.loads(os.environ["NEEDS"])
          expected = {"fixtures", "preflight", "baseline", "postflight"}
          if set(needs) != expected or any(n["result"] != "success" for n in needs.values()):
              raise SystemExit("Preview requires all fixtures, hooks, and baselines to succeed")
          PY
